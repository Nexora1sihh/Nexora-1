version: '3.8'

services:
  # PostgreSQL with PostGIS extension for Geospatial Weather Analytics
  postgres:
    image: postgis/postgis:15-3.3
    container_name: nwip-postgis
    environment:
      POSTGRES_DB: nwip_db
      POSTGRES_USER: nwip_user
      POSTGRES_PASSWORD: nwip_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nwip_user -d nwip_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Apache Kafka Stream Broker
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: nwip-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: nwip-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  # MinIO Object Storage for Weather Images & Video Evidence
  minio:
    image: minio/minio:RELEASE.2023-09-04T19-57-37Z
    container_name: nwip-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"

  # FastAPI Backend API Server
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: nwip-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://nwip_user:nwip_password@postgres:5432/nwip_db
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - MINIO_ENDPOINT=minio:9000
    depends_on:
      postgres:
        condition: service_healthy

  # React Frontend Web App
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: nwip-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
